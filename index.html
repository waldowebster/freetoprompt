<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0e14">
  <meta name="description" content="A free, open source teleprompter. Write your script, adjust your pace, and start prompting. No signup. Your script stays in your browser.">
  <title>Free to Prompt | Free, Open Source Teleprompter</title>
  <link rel="canonical" href="https://freetoprompt.com/">
  <meta property="og:title" content="Free to Prompt">
  <meta property="og:description" content="A free, open source teleprompter. No signup. Your script stays in your browser.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://freetoprompt.com/">
  <link rel="icon" href="favicon.svg?v=ice-blue" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main id="editor">
    <header class="header">
      <h1><img class="brand-mark" src="favicon.svg?v=ice-blue" width="46" height="46" alt=""><span>Free<span class="wordmark-to"> to </span>Prompt<span class="brand-period">.</span></span></h1>
      <nav class="header-links" aria-label="Project links">
        <a class="maker" href="https://waldo.biz/" target="_blank" rel="noopener noreferrer" aria-label="By Waldo, with love. Visit waldo.biz"><span>By Waldo</span><svg class="maker-heart" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-9-5.5-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.5-9 12-9 12Z"/></svg></a>
        <div class="repo-actions">
          <a class="github-link" href="https://github.com/waldowebster/freetoprompt" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 .9a11.1 11.1 0 0 0-3.5 21.63c.55.1.76-.24.76-.54v-2.06c-3.1.67-3.76-1.31-3.76-1.31-.5-1.29-1.24-1.63-1.24-1.63-1.02-.69.08-.68.08-.68 1.12.08 1.7 1.15 1.7 1.15 1 .1.45 2.15 3.27 1.48.1-.72.4-1.21.71-1.49-2.47-.28-5.07-1.24-5.07-5.49 0-1.21.43-2.2 1.14-2.98-.11-.28-.5-1.42.11-2.95 0 0 .93-.3 3.05 1.14a10.6 10.6 0 0 1 5.56 0c2.12-1.44 3.05-1.14 3.05-1.14.61 1.53.22 2.67.11 2.95.71.78 1.14 1.77 1.14 2.98 0 4.26-2.6 5.2-5.08 5.48.4.35.75 1.02.75 2.06v3.09c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/></svg>GitHub</a>
          <a class="star-link" href="https://github.com/waldowebster/freetoprompt" target="_blank" rel="noopener noreferrer" aria-label="Support Free to Prompt with a star on GitHub"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></svg>Star</a>
        </div>
      </nav>
    </header>
    <section class="script-panel" aria-label="Script editor">
      <div class="script-toolbar">
        <label for="script">Your Script</label>
        <div class="script-actions">
          <button id="btnImport" class="quiet">Import</button>
          <button id="btnExport" class="quiet" disabled>Download</button>
          <button id="btnReset" class="quiet" disabled>Reset</button>
          <input id="fileInput" type="file" accept=".txt,.md,text/plain,text/markdown" hidden>
        </div>
      </div>
      <textarea id="script" placeholder="Paste or write your script…" spellcheck="true"></textarea>
      <div class="script-footer"><span id="wordCount">0 words</span><span id="saveStatus" role="status"></span><button id="btnKeys" class="quiet"><span aria-hidden="true" class="key-icon">⌘</span> Keyboard Shortcuts</button></div>
    </section>
  </main>
  <section id="stage" aria-label="Teleprompter" hidden>
    <div id="reading"><div id="content"></div><div id="guide" aria-hidden="true"></div></div>
    <div id="paused" role="status">Paused</div>
    <div id="toast" role="status"></div>
  </section>
  <footer id="bar" aria-label="Teleprompter controls">
    <div class="transport">
      <button id="btnMode" class="primary" disabled>Play</button>
      <button id="btnPlay" class="primary" hidden>Play</button>
      <button id="btnTop" hidden>Restart</button>
    </div>
    <div class="settings">
      <label for="speed"><span>Speed <output id="speedOut" for="speed"></output></span><input type="range" id="speed" min="1" max="100" step="1"></label>
      <label for="size"><span>Text Size <output id="sizeOut" for="size"></output></span><input type="range" id="size" min="24" max="160" step="2"></label>
      <label for="bright"><span>Brightness <output id="brightOut" for="bright"></output></span><input type="range" id="bright" min="15" max="100" step="5"></label>
      <label for="width"><span>Width <output id="widthOut" for="width"></output></span><input type="range" id="width" min="40" max="96" step="2"></label>
    </div>
    <div class="view-controls">
      <label class="toggle"><input type="checkbox" id="mirrorH"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18"/><path d="M8 6 3 18h5Zm8 0 5 12h-5Z" fill="currentColor"/></svg><span>Mirror</span></label>
      <label class="toggle"><input type="checkbox" id="mirrorV"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18"/><path d="M6 8l12-5v5Zm0 8 12 5v-5Z" fill="currentColor"/></svg><span>Flip</span></label>
      <span id="remaining" role="timer"></span>
      <button id="btnFull">Fullscreen</button>
    </div>
  </footer>
  <dialog id="resetDialog" aria-labelledby="resetTitle" aria-describedby="resetDescription">
    <h2 id="resetTitle">Reset Script?</h2>
    <p id="resetDescription">This will clear your current script.</p>
    <div class="dialog-actions"><button id="btnCancelReset" autofocus>Cancel</button><button id="btnConfirmReset" class="danger">Reset Script</button></div>
  </dialog>
  <dialog id="shortcuts" aria-labelledby="shortcutsTitle">
    <div class="dialog-heading"><h2 id="shortcutsTitle">Keyboard Shortcuts</h2><button id="btnCloseKeys" aria-label="Close keyboard shortcuts">✕</button></div>
    <dl>
      <div><dt>Play</dt><dd><kbd>⌘ / Ctrl</kbd> <kbd>Enter</kbd></dd></div>
      <div><dt>Play / Pause</dt><dd><kbd>Space</kbd></dd></div>
      <div><dt>Scroll</dt><dd><kbd>↑</kbd> <kbd>↓</kbd></dd></div>
      <div><dt>Speed</dt><dd><kbd>←</kbd> <kbd>→</kbd></dd></div>
      <div><dt>Text Size</dt><dd><kbd>−</kbd> <kbd>+</kbd></dd></div>
      <div><dt>Restart</dt><dd><kbd>R</kbd></dd></div>
      <div><dt>Mirror</dt><dd><kbd>M</kbd></dd></div>
      <div><dt>Fullscreen</dt><dd><kbd>F</kbd></dd></div>
      <div><dt>Edit Script</dt><dd><kbd>Esc</kbd></dd></div>
    </dl>
  </dialog>
  <noscript>Enable JavaScript to use the teleprompter.</noscript>
</body>
</html>
